<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A1 Products</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f6fb;
    color:#172033;
}

header{
    background:#071a3d;
    color:white;
    padding:16px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:#ffb000;
}

.header-buttons{
    display:flex;
    gap:8px;
    align-items:center;
}

.header-btn{
    border:0;
    text-decoration:none;
    background:#0758a8;
    color:white;
    padding:10px 13px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
    white-space:nowrap;
}

.cart-btn{
    background:#198754;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px 18px 45px;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h1{
    color:#071a3d;
    margin-bottom:8px;
    font-size:42px;
}

.title p{
    color:#666;
    font-size:20px;
}

.search{
    width:100%;
    background:white;
    padding:15px;
    border-radius:10px;
    border:1px solid #ddd;
    margin-bottom:20px;
    font-size:17px;
    outline:none;
}

.categories{
    display:flex;
    gap:10px;
    overflow-x:auto;
    margin-bottom:25px;
    padding-bottom:5px;
}

.category{
    border:0;
    background:white;
    padding:11px 18px;
    border-radius:22px;
    cursor:pointer;
    white-space:nowrap;
    font-weight:bold;
    font-size:15px;
}

.category.active{
    background:#0758a8;
    color:white;
}

.loading{
    text-align:center;
    padding:40px;
    color:#0758a8;
    font-weight:bold;
}

.error{
    display:none;
    background:#ffe5e5;
    color:#b00020;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
}

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.image-box{
    height:230px;
    background:#f7f9fc;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.image-box img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.no-image{
    font-size:65px;
}

.info{
    padding:16px;
}

.category-name{
    color:#0758a8;
    font-size:13px;
    font-weight:bold;
    text-transform:uppercase;
    margin-bottom:8px;
}

.name{
    color:#071a3d;
    font-size:18px;
    font-weight:bold;
    line-height:1.4;
    margin-bottom:12px;
}

.price{
    font-size:23px;
    font-weight:bold;
    margin-bottom:8px;
}

.points{
    color:#198754;
    font-weight:bold;
    font-size:15px;
    margin-bottom:7px;
}

.stock{
    color:#666;
    font-size:14px;
    margin-bottom:15px;
}

.out{
    color:#b00020;
    font-weight:bold;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.buy,
.add{
    border:0;
    padding:11px 5px;
    border-radius:7px;
    color:white;
    font-weight:bold;
    cursor:pointer;
    font-size:14px;
}

.buy{
    background:#0758a8;
}

.add{
    background:#198754;
}

.disabled{
    background:#999;
    cursor:not-allowed;
}

.empty{
    grid-column:1/-1;
    background:white;
    padding:50px;
    text-align:center;
    border-radius:12px;
    color:#666;
}

footer{
    background:#041128;
    color:white;
    text-align:center;
    padding:25px;
}


/* MOBILE */

@media(max-width:950px){

    .products{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    header{
        padding:14px 12px;
    }

    .logo{
        font-size:28px;
    }

    .header-buttons{
        gap:6px;
    }

    .header-btn{
        padding:9px 10px;
        font-size:13px;
    }

    .title h1{
        font-size:34px;
    }

    .title p{
        font-size:17px;
    }

    .products{
        grid-template-columns:1fr;
    }

    .image-box{
        height:260px;
    }

    .buttons{
        grid-template-columns:1fr 1fr;
    }

}


/* VERY SMALL PHONES */

@media(max-width:380px){

    .header-btn{
        padding:8px 7px;
        font-size:12px;
    }

    .logo{
        font-size:25px;
    }

}

</style>

</head>


<body>


<header>

<div class="logo">
A1
</div>


<div class="header-buttons">

<a
    href="dashboard.html"
    class="header-btn"
>
🏠 Dashboard
</a>


<button
    type="button"
    id="cartButton"
    class="header-btn cart-btn"
>
🛒 Cart (<span id="cartCount">0</span>)
</button>

</div>

</header>


<div class="container">


<div class="title">

<h1>
A1 Products
</h1>

<p>
Electronic Products & Appliances
</p>

</div>


<div
    id="errorBox"
    class="error"
>
</div>


<input
    type="search"
    id="search"
    class="search"
    placeholder="Search products..."
>


<div class="categories">

<button
    type="button"
    class="category active"
    data-category="all"
>
All
</button>

<button
    type="button"
    class="category"
    data-category="tv"
>
TV
</button>

<button
    type="button"
    class="category"
    data-category="fridge"
>
Fridge
</button>

<button
    type="button"
    class="category"
    data-category="ac"
>
AC
</button>

<button
    type="button"
    class="category"
    data-category="fan"
>
Fan
</button>

<button
    type="button"
    class="category"
    data-category="lights"
>
Lights
</button>

<button
    type="button"
    class="category"
    data-category="printer"
>
Printer
</button>

<button
    type="button"
    class="category"
    data-category="iron"
>
Iron Box
</button>

<button
    type="button"
    class="category"
    data-category="cooler"
>
Cooler
</button>

</div>


<div
    id="loading"
    class="loading"
>
Loading products...
</div>


<div
    id="products"
    class="products"
    style="display:none;"
>
</div>


</div>


<footer>

<p>
© 2026 A1 Enterprises Pvt. Ltd.
</p>

</footer>


<script>

/* SUPABASE */

const SUPABASE_URL =
"https://rtnxobtczeaxtpxgvfpb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_f8QIMjFi5Zm2a10LcODEPg_z8EOWM3_";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* VARIABLES */

let products = [];

let selectedCategory = "all";

let cart =
JSON.parse(
    localStorage.getItem("a1_cart") || "[]"
);


/* CART COUNT */

function updateCartCount(){

    let count = 0;

    cart.forEach(function(item){

        count += Number(
            item.quantity || 0
        );

    });

    document.getElementById(
        "cartCount"
    ).innerText = count;

}


/* SAVE CART */

function saveCart(){

    localStorage.setItem(
        "a1_cart",
        JSON.stringify(cart)
    );

    updateCartCount();

}


/* PRICE */

function price(value){

    return "₹" +
        Number(value || 0)
        .toLocaleString("en-IN");

}


/* SHOW PRODUCTS */

function showProducts(){

    const box =
        document.getElementById(
            "products"
        );

    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    let filtered =
        products.filter(
            function(product){

                const name =
                    String(
                        product.product_name || ""
                    ).toLowerCase();

                const category =
                    String(
                        product.category || ""
                    ).toLowerCase();


                const searchMatch =
                    !search ||
                    name.includes(search) ||
                    category.includes(search);


                const categoryMatch =
                    selectedCategory === "all" ||
                    category.includes(
                        selectedCategory
                    );


                return (
                    searchMatch &&
                    categoryMatch
                );

            }
        );


    if(filtered.length === 0){

        box.innerHTML = `

            <div class="empty">

                <div style="font-size:50px;">
                    🛒
                </div>

                <h3>
                    No Products Available
                </h3>

                <p style="margin-top:8px;">
                    Products will appear here
                    when A1 products are added.
                </p>

            </div>

        `;

        return;

    }


    let html = "";


    filtered.forEach(
        function(product){

            const stock =
                Number(
                    product.stock || 0
                );


            let imageHTML =
                '<div class="no-image">📦</div>';


            if(product.product_image){

                const imageURL =
                    String(
                        product.product_image
                    );


                if(
                    imageURL.startsWith("http")
                ){

                    imageHTML = `

                        <img
                            src="${imageURL}"
                            alt="${product.product_name || "Product"}"
                            onerror="this.style.display='none';"
                        >

                    `;

                }

            }


            html += `

                <div class="card">

                    <div class="image-box">
                        ${imageHTML}
                    </div>


                    <div class="info">

                        <div class="category-name">
                            ${
                                product.category ||
                                "Electronics"
                            }
                        </div>


                        <div class="name">
                            ${
                                product.product_name ||
                                "A1 Product"
                            }
                        </div>


                        <div class="price">
                            ${
                                price(
                                    product.selling_price
                                )
                            }
                        </div>


                        <div class="points">
                            ⭐ Business Points:
                            ${
                                product.business_points ||
                                0
                            }
                        </div>


                        <div class="
                            stock
                            ${
                                stock <= 0
                                ? "out"
                                : ""
                            }
                        ">

                            ${
                                stock > 0
                                ? "Stock: " + stock
                                : "Out of Stock"
                            }

                        </div>


                        <div class="buttons">

                            <button
                                type="button"
                                class="buy
                                ${
                                    stock <= 0
                                    ? "disabled"
                                    : ""
                                }"
                                ${
                                    stock <= 0
                                    ? "disabled"
                                    : ""
                                }
                                onclick="buyNow(
                                    '${product.product_id}'
                                )"
                            >
                                Buy Now
                            </button>


                            <button
                                type="button"
                                class="add
                                ${
                                    stock <= 0
                                    ? "disabled"
                                    : ""
                                }"
                                ${
                                    stock <= 0
                                    ? "disabled"
                                    : ""
                                }
                                onclick="addToCart(
                                    '${product.product_id}'
                                )"
                            >
                                🛒 Add to Cart
                            </button>

                        </div>

                    </div>

                </div>

            `;

        }
    );


    box.innerHTML = html;

}


/* ADD TO CART */

function addToCart(productId){

    const product =
        products.find(
            function(item){

                return String(
                    item.product_id
                ) === String(productId);

            }
        );


    if(!product){

        alert(
            "Product not found."
        );

        return;

    }


    if(
        Number(product.stock || 0) <= 0
    ){

        alert(
            "Product is out of stock."
        );

        return;

    }


    const existing =
        cart.find(
            function(item){

                return String(
                    item.product_id
                ) === String(productId);

            }
        );


    if(existing){

        existing.quantity += 1;

    }else{

        cart.push({

            product_id:
                product.product_id,

            product_name:
                product.product_name,

            selling_price:
                Number(
                    product.selling_price || 0
                ),

            business_points:
                Number(
                    product.business_points || 0
                ),

            product_image:
                product.product_image || "",

            quantity:1

        });

    }


    saveCart();


    alert(
        "Product added to cart successfully."
    );

}


/* BUY NOW */

function buyNow(productId){

    addToCart(productId);

}


/* LOAD PRODUCTS */

async function loadProducts(){

    const loading =
        document.getElementById(
            "loading"
        );

    const box =
        document.getElementById(
            "products"
        );

    const errorBox =
        document.getElementById(
            "errorBox"
        );


    try{

        const result =
            await supabaseClient
            .from("products")
            .select("*");


        if(result.error){

            throw result.error;

        }


        products =
            result.data || [];


        products =
            products.filter(
                function(product){

                    return String(
                        product.status || ""
                    ).toLowerCase() ===
                    "active";

                }
            );


        loading.style.display =
            "none";

        box.style.display =
            "grid";


        showProducts();


    }catch(error){

        console.error(
            "Products error:",
            error
        );


        loading.style.display =
            "none";


        errorBox.style.display =
            "block";


        errorBox.innerText =
            "Unable to load products: " +
            error.message;

    }

}


/* SEARCH */

document
.getElementById("search")
.addEventListener(
    "input",
    showProducts
);


/* CATEGORIES */

document
.querySelectorAll(".category")
.forEach(
    function(button){

        button.addEventListener(
            "click",
            function(){

                document
                .querySelectorAll(
                    ".category"
                )
                .forEach(
                    function(item){

                        item.classList.remove(
                            "active"
                        );

                    }
                );


                this.classList.add(
                    "active"
                );


                selectedCategory =
                    this.dataset.category;


                showProducts();

            }
        );

    }
);


/* CART BUTTON */

document
.getElementById("cartButton")
.addEventListener(
    "click",
    function(){

        window.location.href =
            "cart.html";

    }
);


/* START */

updateCartCount();

loadProducts();

</script>


</body>

    </html>
