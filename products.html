<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>A1 Products</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f6fb;
    color:#172033;
}

/* HEADER */

header{
    background:#071a3d;
    color:white;
    padding:16px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:#ffb000;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.dashboard-btn,
.cart-btn{
    color:white;
    text-decoration:none;
    background:#0758a8;
    padding:10px 15px;
    border-radius:7px;
    font-size:14px;
    font-weight:bold;
    border:0;
    cursor:pointer;
}

.cart-btn{
    background:#198754;
}

/* CONTAINER */

.container{
    max-width:1200px;
    margin:auto;
    padding:25px 18px 40px;
}

/* TITLE */

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h1{
    color:#071a3d;
    margin-bottom:8px;
    font-size:30px;
}

.title p{
    color:#666;
}

/* SEARCH */

.search-box{
    background:white;
    padding:15px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
    margin-bottom:18px;
}

.search-input{
    width:100%;
    padding:14px;
    border:1px solid #d5dbe5;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

.search-input:focus{
    border-color:#0758a8;
}

/* CATEGORIES */

.categories{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding-bottom:8px;
    margin-bottom:25px;
}

.category-btn{
    border:0;
    background:white;
    color:#172033;
    padding:11px 17px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
    font-weight:bold;
}

.category-btn.active{
    background:#0758a8;
    color:white;
}

/* ERROR */

.error-box{
    display:none;
    background:#ffe5e5;
    color:#b00020;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
}

/* LOADING */

.loading{
    text-align:center;
    padding:40px;
    color:#0758a8;
    font-weight:bold;
}

/* PRODUCTS GRID */

.products-grid{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);
    gap:20px;
}

/* PRODUCT CARD */

.product-card{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    transition:.2s;
    display:flex;
    flex-direction:column;
}

.product-card:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

/* IMAGE */

.product-image-box{
    width:100%;
    height:210px;
    background:#f7f9fc;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.product-image{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

.no-image{
    text-align:center;
    color:#9aa3b2;
    font-size:50px;
}

/* PRODUCT INFO */

.product-info{
    padding:17px;
    display:flex;
    flex-direction:column;
    flex:1;
}

.product-category{
    color:#0758a8;
    font-size:12px;
    font-weight:bold;
    text-transform:uppercase;
    margin-bottom:7px;
}

.product-name{
    color:#071a3d;
    font-size:17px;
    font-weight:bold;
    line-height:1.35;
    margin-bottom:12px;
}

.product-price{
    color:#071a3d;
    font-size:23px;
    font-weight:bold;
    margin-bottom:8px;
}

.product-points{
    color:#198754;
    font-size:14px;
    font-weight:bold;
    margin-bottom:6px;
}

.product-stock{
    color:#666;
    font-size:13px;
    margin-bottom:15px;
}

.out-stock{
    color:#b00020;
    font-weight:bold;
}

/* BUTTONS */

.product-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:auto;
}

.buy-btn,
.cart-add-btn{
    border:0;
    padding:11px 7px;
    border-radius:7px;
    color:white;
    font-weight:bold;
    cursor:pointer;
    font-size:13px;
}

.buy-btn{
    background:#0758a8;
}

.buy-btn:hover{
    background:#071a3d;
}

.cart-add-btn{
    background:#198754;
}

.cart-add-btn:hover{
    background:#146c43;
}

.disabled-btn{
    background:#999;
    cursor:not-allowed;
}

/* EMPTY */

.empty{
    grid-column:1/-1;
    background:white;
    padding:50px 20px;
    border-radius:12px;
    text-align:center;
    color:#666;
}

.empty-icon{
    font-size:50px;
    margin-bottom:12px;
}

/* CART POPUP */

.cart-message{
    display:none;
    position:fixed;
    right:20px;
    bottom:20px;
    background:#198754;
    color:white;
    padding:15px 20px;
    border-radius:9px;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
    z-index:1000;
    font-weight:bold;
}

/* FOOTER */

footer{
    background:#041128;
    color:white;
    text-align:center;
    padding:25px;
    margin-top:20px;
}

/* RESPONSIVE */

@media(max-width:1000px){

    .products-grid{
        grid-template-columns:
            repeat(3,1fr);
    }

}

@media(max-width:700px){

    header{
        padding:14px;
    }

    .logo{
        font-size:25px;
    }

    .dashboard-btn{
        display:none;
    }

    .products-grid{
        grid-template-columns:
            repeat(2,1fr);
        gap:12px;
    }

    .product-image-box{
        height:160px;
    }

    .product-info{
        padding:12px;
    }

    .product-name{
        font-size:15px;
    }

    .product-price{
        font-size:19px;
    }

    .product-buttons{
        grid-template-columns:1fr;
    }

}

@media(max-width:400px){

    .products-grid{
        grid-template-columns:1fr 1fr;
    }

    .product-image-box{
        height:140px;
    }

}

</style>

</head>


<body>

<div class="logo">
A1
</div>

<a

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://rtnxobtczeaxtpxgvfpb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_f8QIMjFi5Zm2a10LcODEPg_z8EOWM3_";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   GLOBAL DATA
========================================= */

let allProducts = [];

let selectedCategory = "all";

let cart =
    JSON.parse(
        localStorage.getItem("a1_cart") ||
        "[]"
    );


/* =========================================
   UPDATE CART COUNT
========================================= */

function updateCartCount(){

    const total =
        cart.reduce(
            function(sum,item){

                return sum +
                    Number(item.quantity || 0);

            },
            0
        );

    document
    .getElementById("cartCount")
    .innerText =
        total;

}


/* =========================================
   SAVE CART
========================================= */

function saveCart(){

    localStorage.setItem(
        "a1_cart",
        JSON.stringify(cart)
    );

    updateCartCount();

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================
   FORMAT PRICE
========================================= */

function formatPrice(value){

    const number =
        Number(value || 0);

    return "₹" +
        number.toLocaleString(
            "en-IN"
        );

}


/* =========================================
   IMAGE ERROR
========================================= */

function imageError(image){

    image.style.display =
        "none";

    const parent =
        image.parentElement;

    parent.innerHTML =
        '<div class="no-image">📦</div>';

}


/* =========================================
   SHOW PRODUCTS
========================================= */

function displayProducts(){

    const grid =
        document.getElementById(
            "productsGrid"
        );

    const search =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();


    const filtered =
        allProducts.filter(
            function(product){

                const name =
                    String(
                        product.product_name || ""
                    ).toLowerCase();

                const category =
                    String(
                        product.category || ""
                    ).toLowerCase();

                const matchesSearch =
                    !search ||
                    name.includes(search) ||
                    category.includes(search);

                const matchesCategory =
                    selectedCategory === "all" ||
                    category.includes(
                        selectedCategory
                    );


                return (
                    matchesSearch &&
                    matchesCategory
                );

            }
        );


    if(filtered.length === 0){

        grid.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🛒
                </div>

                <h3>
                    No Products Available
                </h3>

                <p style="margin-top:8px;">
                    Products will appear here
                    when A1 products are added.
                </p>

            </div>

        `;

        return;

    }


    grid.innerHTML =
        filtered.map(
            function(product){

                const stock =
                    Number(
                        product.stock || 0
                    );

                const image =
                    product.product_image;

                const imageHTML =
                    image
                    ?
                    `
                    <img
                        src="${escapeHTML(image)}"
                        class="product-image"
                        alt="${escapeHTML(
                            product.product_name
                        )}"
                        onerror="imageError(this)"
                    >
                    `
                    :
                    `
                    <div class="no-image">
                        📦
                    </div>
                    `;


                return `

                <div class="product-card">

                    <div class="product-image-box">
                        ${imageHTML}
                    </div>


                    <div class="product-info">

                        <div class="product-category">
                            ${escapeHTML(
                                product.category ||
                                "Electronics"
                            )}
                        </div>


                        <div class="product-name">
                            ${escapeHTML(
                                product.product_name ||
                                "A1 Product"
                            )}
                        </div>


                        <div class="product-price">
                            ${formatPrice(
                                product.selling_price
                            )}
                        </div>


                        <div class="product-points">
                            ⭐ Business Points:
                            ${escapeHTML(
                                product.business_points ||
                                0
                            )}
                        </div>


                        <div
                            class="product-stock ${
                                stock <= 0
                                ? "out-stock"
                                : ""
                            }"
                        >
                            ${
                                stock > 0
                                ? "Stock: " + stock
                                : "Out of Stock"
                            }
                        </div>


                        <div class="product-buttons">

                            <button
                                class="buy-btn ${
                                    stock <= 0
                                    ? "disabled-btn"
                                    : ""
                                }"
                                ${
                                    stock <= 0
                                    ? "disabled"
                                    : ""
                                }
                                onclick="buyNow(
                                    '${escapeHTML(
                                        product.product_id
                                    )}'
                                )"
                            >
                                Buy Now
                            </button>


                            <button
                                class="cart-add-btn ${
                                    stock <= 0
                                    ? "disabled-btn"
                                    : ""
                                }"
                                ${
                                    stock <= 0
                                    ? "disabled"
                                    : ""
                                }
                                onclick="addToCart(
                                    '${escapeHTML(
                                        product.product_id
                                    )}'
                                )"
                            >
                                🛒 Add to Cart
                            </button>

                        </div>

                    </div>

                </div>

                `;

            }
        )
        .join("");

}


/* =========================================
   ADD TO CART
========================================= */

function addToCart(productId){

    const product =
        allProducts.find(
            function(item){

                return item.product_id ===
                    productId;

            }
        );


    if(!product){

        alert(
            "Product not found."
        );

        return;

    }


    const stock =
        Number(
            product.stock || 0
        );


    if(stock <= 0){

        alert(
            "This product is currently out of stock."
        );

        return;

    }


    const existing =
        cart.find(
            function(item){

                return item.product_id ===
                    productId;

            }
        );


    if(existing){

        if(
            existing.quantity >=
            stock
        ){

            alert(
                "Maximum available stock reached."
            );

            return;

        }

        existing.quantity += 1;

    }else{

        cart.push({

            product_id:
                product.product_id,

            product_name:
                product.product_name,

            selling_price:
                Number(
                    product.selling_price ||
                    0
                ),

            business_points:
                Number(
                    product.business_points ||
                    0
                ),

            product_image:
                product.product_image ||
                "",

            quantity:1

        });

    }


    saveCart();


    const message =
        document.getElementById(
            "cartMessage"
        );


    message.style.display =
        "block";


    setTimeout(
        function(){

            message.style.display =
                "none";

        },
        1800
    );

}


/* =========================================
   BUY NOW
========================================= */

function buyNow(productId){

    addToCart(productId);

}


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

    const loading =
        document.getElementById(
            "loading"
        );

    const grid =
        document.getElementById(
            "productsGrid"
        );

    const errorBox =
        document.getElementById(
            "errorBox"
        );


    try{

        const {
            data,
            error
        } =
        await supabaseClient
        .from("products")
        .select(
            `
            product_id,
            product_name,
            category,
            description,
            selling_price,
            business_points,
            stock,
            product_image,
            status
            `
        )
        .eq(
            "status",
            "active"
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


        if(error){

            throw error;

        }


        allProducts =
            data || [];


        loading.style.display =
            "none";


        grid.style.display =
            "grid";


        displayProducts();


    }catch(error){

        console.error(error);


        loading.style.display =
            "none";


        errorBox.style.display =
            "block";


        errorBox.innerText =
            "Unable to load products: " +
            error.message;

    }

}


/* =========================================
   SEARCH
========================================= */

document
.getElementById("searchInput")
.addEventListener(
    "input",
    displayProducts
);


/* =========================================
   CATEGORY FILTER
========================================= */

document
.querySelectorAll(".category-btn")
.forEach(
    function(button){

        button.addEventListener(
            "click",
            function()
