<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>A1 Products</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f6fb;
    color:#172033;
}

header{
    background:#071a3d;
    color:white;
    padding:18px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:#ffb000;
}

.back{
    color:white;
    text-decoration:none;
    background:#0758a8;
    padding:10px 16px;
    border-radius:6px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px 18px;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h1{
    color:#071a3d;
    margin-bottom:8px;
}

.title p{
    color:#666;
}

.toolbar{
    background:white;
    padding:18px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
    margin-bottom:25px;
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:15px;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #d5dbe5;
    border-radius:7px;
    font-size:15px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#0758a8;
}

.loading{
    text-align:center;
    background:white;
    padding:35px;
    border-radius:12px;
    color:#0758a8;
    font-weight:bold;
}

.error{
    display:none;
    background:#ffe5e5;
    color:#b00020;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
}

.empty{
    background:white;
    padding:45px 20px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
    text-align:center;
    color:#666;
}

.empty h2{
    color:#071a3d;
    margin-bottom:10px;
}

.products{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.product{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    transition:.2s;
}

.product:hover{
    transform:translateY(-3px);
}

.product-image{
    width:100%;
    height:210px;
    background:#eef2f7;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.no-image{
    color:#999;
    font-size:15px;
}

.product-body{
    padding:18px;
}

.category{
    color:#0758a8;
    font-size:13px;
    font-weight:bold;
    margin-bottom:8px;
}

.product-name{
    color:#071a3d;
    font-size:20px;
    font-weight:bold;
    margin-bottom:8px;
}

.description{
    color:#666;
    font-size:14px;
    line-height:1.5;
    min-height:42px;
    margin-bottom:15px;
}

.price{
    color:#071a3d;
    font-size:23px;
    font-weight:bold;
    margin-bottom:8px;
}

.bp{
    color:#198754;
    font-size:14px;
    font-weight:bold;
    margin-bottom:8px;
}

.stock{
    font-size:13px;
    color:#666;
    margin-bottom:15px;
}

.stock.available{
    color:#198754;
}

.stock.out{
    color:#b00020;
    font-weight:bold;
}

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    background:#e7f8ed;
    color:#146c2e;
    font-size:12px;
    font-weight:bold;
}

.order-btn{
    width:100%;
    border:none;
    background:#0758a8;
    color:white;
    padding:12px;
    border-radius:7px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:12px;
}

.order-btn:hover{
    background:#064986;
}

.order-btn:disabled{
    background:#aaa;
    cursor:not-allowed;
}

footer{
    margin-top:35px;
    background:#041128;
    color:white;
    text-align:center;
    padding:25px;
}

@media(max-width:650px){

    .toolbar{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<header>

<div class="logo">
A1
</div>

<a
    href="dashboard.html"
    class="back"
>
← Dashboard
</a>

</header>


<div class="container">


<div class="title">

<h1>
A1 Products
</h1>

<p>
Electronic Products & Appliances
</p>

</div>


<div
    id="errorBox"
    class="error"
>
</div>


<div class="toolbar">

<input
    type="text"
    id="searchInput"
    placeholder="Search products..."
>

<select id="categoryFilter">

<option value="">
All Categories
</option>

</select>

</div>


<div
    id="loading"
    class="loading"
>
Loading products...
</div>


<div
    id="emptyBox"
    class="empty"
    style="display:none;"
>

<h2>
No Products Available
</h2>

<p>
Products will appear here when A1 products
are added to the system.
</p>

</div>


<div
    id="productsGrid"
    class="products"
    style="display:none;"
>
</div>


</div>


<footer>

<p>
© 2026 A1 Enterprises Pvt. Ltd.
</p>

</footer>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://rtnxobtczeaxtpxgvfpb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_f8QIMjFi5Zm2a10LcODEPg_z8EOWM3_";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   VARIABLES
========================================= */

let allProducts = [];


/* =========================================
   HTML SAFETY
========================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

    const loading =
        document.getElementById("loading");

    const errorBox =
        document.getElementById("errorBox");

    const emptyBox =
        document.getElementById("emptyBox");

    const grid =
        document.getElementById("productsGrid");


    try{

        const {
            data:userData,
            error:userError
        } =
        await supabaseClient
        .auth
        .getUser();


        if(userError || !userData.user){

            window.location.href =
                "login.html";

            return;

        }


        const {
            data,
            error
        } =
        await supabaseClient
        .from("products")
        .select(`
            id,
            product_id,
            product_name,
            category,
            description,
            selling_price,
            business_points,
            stock,
            product_image,
            status,
            created_at
        `)
        .eq("status","active")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


        if(error){

            throw error;

        }


        allProducts =
            data || [];


        loading.style.display =
            "none";


        createCategories(
            allProducts
        );


        if(allProducts.length === 0){

            emptyBox.style.display =
                "block";

            return;

        }


        grid.style.display =
            "grid";


        renderProducts(
            allProducts
        );


    }
    catch(error){

        console.error(
            "Products Error:",
            error
        );


        loading.style.display =
            "none";


        errorBox.style.display =
            "block";


        errorBox.innerText =
            "Unable to load products: " +
            error.message;

    }

}


/* =========================================
   CATEGORIES
========================================= */

function createCategories(products){

    const select =
        document.getElementById(
            "categoryFilter"
        );


    const categories =
        [
            ...new Set(
                products
                .map(
                    product =>
                        product.category
                )
                .filter(Boolean)
            )
        ]
        .sort();


    categories.forEach(
        category => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                category;

            option.textContent =
                category;

            select.appendChild(
                option
            );

        }
    );

}


/* =========================================
   RENDER PRODUCTS
========================================= */

function renderProducts(products){

    const grid =
        document.getElementById(
            "productsGrid"
        );

    const emptyBox =
        document.getElementById(
            "emptyBox"
        );


    if(products.length === 0){

        grid.innerHTML = "";

        grid.style.display =
            "none";

        emptyBox.style.display =
            "block";

        emptyBox.querySelector("h2")
            .innerText =
            "No Matching Products";

        emptyBox.querySelector("p")
            .innerText =
            "Try another search or category.";

        return;

    }


    emptyBox.style.display =
        "none";

    grid.style.display =
        "grid";


    grid.innerHTML =
        products
        .map(
            product => {

                const stock =
                    Number(
                        product.stock || 0
                    );


                const price =
                    Number(
                        product.selling_price || 0
                    );


                const bp =
                    Number(
                        product.business_points || 0
                    );


                const image =
                    product.product_image;


                return `

                <div class="product">

                    <div class="product-image">

                        ${
                            image
                            ?
                            `
                            <img
                                src="${escapeHTML(image)}"
                                alt="${escapeHTML(product.product_name)}"
                            >
                            `
                            :
                            `
                            <div class="no-image">
                                Product Image
                            </div>
                            `
                        }

                    </div>


                    <div class="product-body">

                        <div class="category">

                            ${escapeHTML(
                                product.category ||
                                "Electronics"
                            )}

                        </div>


                        <div class="product-name">

                            ${escapeHTML(
                                product.product_name ||
                                "A1 Product"
                            )}

                        </div>


                        <div class="description">

                            ${escapeHTML(
                                product.description ||
                                "No description available."
                            )}

                        </div>


                        <div class="price">

                            ₹${price.toLocaleString(
                                "en-IN",
                                {
                                    minimumFractionDigits:2,
                                    maximumFractionDigits:2
                                }
                            )}

                        </div>


                        <div class="bp">

                            Business Points:
                            ${bp}

                        </div>


                        <div
                            class="stock ${
                                stock > 0
                                ? "available"
                                : "out"
                            }"
                        >

                            ${
                                stock > 0
                                ? "Stock Available: " + stock
                                : "Out of Stock"
                            }

                        </div>


                        <span class="status">

                            Active

                        </span>


                        <button
                            class="order-btn"
                            ${
                                stock <= 0
                                ? "disabled"
                                : ""
                            }
                            onclick="orderProduct('${escapeHTML(
                                product.product_id ||
                                product.id
                            )}')"
                        >

                            ${
                                stock > 0
                                ? "Order Product"
                                : "Out of Stock"
                            }

                        </button>

                    </div>

                </div>

                `;

            }
        )
        .join("");

}


/* =========================================
   SEARCH + CATEGORY
========================================= */

function filterProducts(){

    const search =
        document
        .getElementById(
            "searchInput"
        )
        .value
        .toLowerCase()
        .trim();


    const category =
        document
        .getElementById(
            "categoryFilter"
        )
        .value;


    const filtered =
        allProducts.filter(
            product => {

                const text =
                    `
                    ${product.product_name || ""}
                    ${product.category || ""}
                    ${product.description || ""}
                    `
                    .toLowerCase();


                const matchesSearch =
                    !search ||
                    text.includes(search);


                const matchesCategory =
                    !category ||
                    product.category === category;


                return (
                    matchesSearch &&
                    matchesCategory
                );

            }
        );


    renderProducts(
        filtered
    );

}


document
.getElementById(
    "searchInput"
)
.addEventListener(
    "input",
    filterProducts
);


document
.getElementById(
    "categoryFilter"
)
.addEventListener(
    "change",
    filterProducts
);


/* =========================================
   ORDER BUTTON
========================================= */

function orderProduct(productId){

    /*
       Checkout system will be connected
       in the next step.
    */

    window.location.href =
        "checkout.html?product=" +
        encodeURIComponent(
            productId
        );

}


/* =========================================
   START
========================================= */

loadProducts();

</script>


</body>

  </html>
