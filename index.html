<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>A1 Member Registration</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f6fb;
    color:#172033;
}

header{
    background:#071a3d;
    color:white;
    padding:18px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:#ffb000;
}

.home{
    color:white;
    text-decoration:none;
    background:#0758a8;
    padding:9px 15px;
    border-radius:6px;
}

.container{
    max-width:850px;
    margin:auto;
    padding:35px 18px;
}

.title{
    text-align:center;
    margin-bottom:30px;
}

.title h1{
    color:#071a3d;
    margin-bottom:8px;
}

.title p{
    color:#666;
}

.form-box{
    background:white;
    padding:30px;
    border-radius:14px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.field{
    display:flex;
    flex-direction:column;
}

.full{
    grid-column:1 / -1;
}

label{
    font-weight:bold;
    margin-bottom:7px;
}

input,
select,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #d5dbe5;
    border-radius:7px;
    font-size:15px;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#0758a8;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.terms{
    margin-top:20px;
    display:flex;
    gap:8px;
    align-items:flex-start;
    font-size:14px;
    color:#555;
}

.terms input{
    width:auto;
    margin-top:3px;
}

button{
    width:100%;
    margin-top:22px;
    padding:15px;
    border:0;
    border-radius:7px;
    background:#0758a8;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#064985;
}

button:disabled{
    background:#777;
    cursor:not-allowed;
}

.login{
    text-align:center;
    margin-top:20px;
    color:#666;
}

.login a{
    color:#0758a8;
    font-weight:bold;
    text-decoration:none;
}

.note{
    margin-top:20px;
    background:#fff8df;
    padding:15px;
    border-radius:8px;
    font-size:13px;
    color:#555;
    line-height:1.5;
}

footer{
    margin-top:30px;
    background:#041128;
    color:white;
    text-align:center;
    padding:25px;
}

@media(max-width:650px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .form-box{
        padding:20px;
    }

}

</style>

</head>


<body>


<header>

<div class="logo">
A1
</div>

<a
    href="index.html"
    class="home"
>
← Home
</a>

</header>


<div class="container">


<div class="title">

<h1>
A1 Member Registration
</h1>

<p>
Create your A1 member account
</p>

</div>


<div class="form-box">


<form id="registerForm">


<div class="form-grid">


<div class="field">

<label>
Full Name *
</label>

<input
    type="text"
    id="fullName"
    placeholder="Enter full name"
    required
>

</div>


<div class="field">

<label>
Mobile Number *
</label>

<input
    type="tel"
    id="mobile"
    placeholder="Enter 10-digit mobile number"
    pattern="[0-9]{10}"
    maxlength="10"
    required
>

</div>


<div class="field">

<label>
Email Address *
</label>

<input
    type="email"
    id="email"
    placeholder="Enter email address"
    required
>

</div>


<div class="field">

<label>
Date of Birth
</label>

<input
    type="date"
    id="dob"
>

</div>


<div class="field">

<label>
State *
</label>

<select
    id="state"
    required
>

<option value="">
Select State
</option>

<option value="Andhra Pradesh">
Andhra Pradesh
</option>

<option value="Telangana">
Telangana
</option>

<option value="Karnataka">
Karnataka
</option>

<option value="Tamil Nadu">
Tamil Nadu
</option>

<option value="Other">
Other
</option>

</select>

</div>


<div class="field">

<label>
City
</label>

<input
    type="text"
    id="city"
    placeholder="Enter city"
>

</div>


<div class="field full">

<label>
Address
</label>

<textarea
    id="address"
    placeholder="Enter your address"
></textarea>

</div>


<div class="field">

<label>
Referral ID
</label>

<input
    type="text"
    id="referral"
    placeholder="Enter referral ID if applicable"
>

</div>


<div class="field">

<label>
Password *
</label>

<input
    type="password"
    id="password"
    placeholder="Create password"
    minlength="6"
    required
>

</div>


<div class="field">

<label>
Confirm Password *
</label>

<input
    type="password"
    id="confirmPassword"
    placeholder="Confirm password"
    minlength="6"
    required
>

</div>


</div>


<div class="terms">

<input
    type="checkbox"
    id="terms"
    required
>

<label for="terms">

I agree to the A1 Terms & Conditions and
Privacy Policy.

</label>

</div>


<button
    type="submit"
    id="registerButton"
>

Create Account

</button>


</form>


<div class="login">

Already have an account?

<a href="login.html">
Login here
</a>

</div>


<div class="note">

<strong>Important:</strong>

Your account will be created securely using
A1's Supabase authentication system.
Your password is not stored in this webpage.

</div>


</div>

</div>


<footer>

<p>
© 2026 A1 Enterprises Pvt. Ltd.
</p>

</footer>


<script>

/* =========================================
   A1 SUPABASE CONNECTION
   ========================================= */

const SUPABASE_URL =
"https://rtnxobtczeaxtpxgvfpb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_f8QIMjFi5Zm2a10LcODEPg_z8EOWM3_";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   REGISTRATION
   ========================================= */

document
.getElementById("registerForm")
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const fullName =
            document
            .getElementById("fullName")
            .value
            .trim();


        const mobile =
            document
            .getElementById("mobile")
            .value
            .trim();


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const dob =
            document
            .getElementById("dob")
            .value;


        const state =
            document
            .getElementById("state")
            .value;


        const city =
            document
            .getElementById("city")
            .value
            .trim();


        const address =
            document
            .getElementById("address")
            .value
            .trim();


        const referral =
            document
            .getElementById("referral")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value;


        /* Password check */

        if(password !== confirmPassword){

            alert(
                "Password and Confirm Password do not match."
            );

            return;

        }


        /* Mobile check */

        if(!/^[0-9]{10}$/.test(mobile)){

            alert(
                "Please enter a valid 10-digit mobile number."
            );

            return;

        }


        /* Password length */

        if(password.length < 6){

            alert(
                "Password must contain at least 6 characters."
            );

            return;

        }


        const button =
            document
            .getElementById("registerButton");


        button.disabled = true;

        button.innerText =
            "Creating Account...";


        try{

            /* Create Supabase Auth account */

            const { data, error } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        /* Email confirmation redirect */

                        emailRedirectTo:
                            "https://kuruvasrikanth11-droid.github.io/A1-MLM-Website/",


                        /* Member information */

                        data: {

                            full_name:
                                fullName,

                            mobile:
                                mobile,

                            date_of_birth:
                                dob,

                            state:
                                state,

                            city:
                                city,

                            address:
                                address,

                            referral_id:
                                referral

                        }

                    }

                });


            if(error){

                alert(
                    "Registration failed:\n\n" +
                    error.message
                );

                button.disabled = false;

                button.innerText =
                    "Create Account";

                return;

            }


            /* Success */

            if(data.user){

                if(data.session){

                    alert(
                        "A1 account created successfully!\n\n" +
                        "You can now login."
                    );

                }else{

                    alert(
                        "A1 account created successfully!\n\n" +
                        "Please check your email and confirm your email address before logging in."
                    );

                }

            }


            document
            .getElementById("registerForm")
            .reset();


            button.disabled = false;

            button.innerText =
                "Create Account";


        }catch(error){

            alert(
                "Something went wrong.\n\n" +
                error.message
            );


            button.disabled = false;

            button.innerText =
                "Create Account";

        }

    }
);

</script>


</body>

</html>
