<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A1 Cart</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f6fb;
    color:#172033;
}

header{
    background:#071a3d;
    color:white;
    padding:15px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.logo{
    color:#ffb000;
    font-size:30px;
    font-weight:bold;
}

.nav{
    display:flex;
    gap:8px;
}

.nav a{
    color:white;
    text-decoration:none;
    padding:10px 12px;
    border-radius:7px;
    background:#0758a8;
    font-weight:bold;
    font-size:14px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px 18px 50px;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h1{
    color:#071a3d;
    margin-bottom:8px;
}

.title p{
    color:#666;
}

.layout{
    display:grid;
    grid-template-columns:1.5fr .8fr;
    gap:20px;
}

.box{
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.box h2{
    color:#071a3d;
    margin-bottom:18px;
}

.item{
    display:flex;
    gap:15px;
    padding:15px 0;
    border-bottom:1px solid #eee;
}

.image{
    width:100px;
    height:100px;
    background:#f7f9fc;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    flex-shrink:0;
}

.image img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.no-image{
    font-size:45px;
}

.info{
    flex:1;
}

.name{
    color:#071a3d;
    font-weight:bold;
    font-size:17px;
    margin-bottom:8px;
}

.details{
    color:#666;
    line-height:1.7;
    font-size:14px;
}

.points{
    color:#198754;
    font-weight:bold;
}

.quantity{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:12px;
}

.qty-btn{
    width:32px;
    height:32px;
    border:0;
    border-radius:6px;
    background:#0758a8;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.qty{
    min-width:25px;
    text-align:center;
    font-weight:bold;
}

.remove{
    margin-top:10px;
    border:0;
    background:#dc3545;
    color:white;
    padding:7px 10px;
    border-radius:6px;
    cursor:pointer;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:11px 0;
    color:#555;
}

.total{
    border-top:1px solid #ddd;
    margin-top:10px;
    padding-top:16px;
    display:flex;
    justify-content:space-between;
    font-size:22px;
    font-weight:bold;
    color:#071a3d;
}

.total-points{
    color:#198754;
    font-weight:bold;
}

.checkout{
    display:block;
    width:100%;
    text-align:center;
    text-decoration:none;
    border:0;
    background:#198754;
    color:white;
    padding:14px;
    margin-top:20px;
    border-radius:8px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.products{
    display:block;
    width:100%;
    text-align:center;
    text-decoration:none;
    background:#0758a8;
    color:white;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    font-weight:bold;
}

.empty{
    background:white;
    border-radius:12px;
    padding:55px 20px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.empty-icon{
    font-size:60px;
    margin-bottom:15px;
}

.empty h2{
    color:#071a3d;
    margin-bottom:8px;
}

footer{
    background:#041128;
    color:white;
    text-align:center;
    padding:25px;
    margin-top:20px;
}

@media(max-width:700px){

    header{
        padding:14px 12px;
    }

    .nav a{
        padding:9px 8px;
        font-size:12px;
    }

    .layout{
        grid-template-columns:1fr;
    }

    .item{
        gap:10px;
    }

    .image{
        width:80px;
        height:80px;
    }

    .name{
        font-size:15px;
    }

}

</style>

</head>


<body>


<header>

<div class="logo">
A1
</div>


<div class="nav">

<a href="dashboard.html">
🏠 Dashboard
</a>

<a href="products.html">
🛍 Products
</a>

</div>

</header>


<div class="container">


<div class="title">

<h1>
🛒 My Cart
</h1>

<p>
Review your products before checkout
</p>

</div>


<div id="cartArea"></div>


</div>


<footer>

<p>
© 2026 A1 Enterprises Pvt. Ltd.
</p>

</footer>


<script>

/* ================================
   CART
================================ */

let cart =
JSON.parse(
    localStorage.getItem("a1_cart") || "[]"
);


/* ================================
   PRICE
================================ */

function price(value){

    return "₹" +
        Number(value || 0)
        .toLocaleString("en-IN");

}


/* ================================
   SAVE CART
================================ */

function saveCart(){

    localStorage.setItem(
        "a1_cart",
        JSON.stringify(cart)
    );

}


/* ================================
   CHANGE QUANTITY
================================ */

function changeQuantity(index, change){

    if(!cart[index]){
        return;
    }


    cart[index].quantity =
        Number(
            cart[index].quantity || 1
        ) + change;


    if(cart[index].quantity <= 0){

        cart.splice(index,1);

    }


    saveCart();

    renderCart();

}


/* ================================
   REMOVE
================================ */

function removeItem(index){

    cart.splice(index,1);

    saveCart();

    renderCart();

}


/* ================================
   RENDER CART
================================ */

function renderCart(){

    const area =
        document.getElementById(
            "cartArea"
        );


    if(cart.length === 0){

        area.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🛒
                </div>

                <h2>
                    Your Cart is Empty
                </h2>

                <p>
                    Add products to your cart
                    to continue.
                </p>

                <a
                    href="products.html"
                    class="products"
                >
                    Browse Products
                </a>

            </div>

        `;

        return;

    }


    let itemsHTML = "";

    let totalItems = 0;

    let totalAmount = 0;

    let totalPoints = 0;


    cart.forEach(
        function(item,index){

            const quantity =
                Number(
                    item.quantity || 1
                );


            const itemPrice =
                Number(
                    item.selling_price || 0
                );


            const itemPoints =
                Number(
                    item.business_points || 0
                );


            totalItems +=
                quantity;


            totalAmount +=
                itemPrice * quantity;


            totalPoints +=
                itemPoints * quantity;


            let imageHTML = `

                <div class="no-image">
                    📦
                </div>

            `;


            if(item.product_image){

                imageHTML = `

                    <img
                        src="${item.product_image}"
                        alt="Product"
                    >

                `;

            }


            itemsHTML += `

                <div class="item">

                    <div class="image">

                        ${imageHTML}

                    </div>


                    <div class="info">

                        <div class="name">

                            ${
                                item.product_name ||
                                "A1 Product"
                            }

                        </div>


                        <div class="details">

                            Price:
                            ${
                                price(itemPrice)
                            }

                            <br>

                            Business Points:
                            <span class="points">
                                ${itemPoints}
                            </span>

                        </div>


                        <div class="quantity">

                            <button
                                type="button"
                                class="qty-btn"
                                onclick="changeQuantity(
                                    ${index},
                                    -1
                                )"
                            >
                                −
                            </button>


                            <span class="qty">
                                ${quantity}
                            </span>


                            <button
                                type="button"
                                class="qty-btn"
                                onclick="changeQuantity(
                                    ${index},
                                    1
                                )"
                            >
                                +
                            </button>

                        </div>


                        <button
                            type="button"
                            class="remove"
                            onclick="removeItem(
                                ${index}
                            )"
                        >
                            Remove
                        </button>

                    </div>

                </div>

            `;

        }
    );


    area.innerHTML = `

        <div class="layout">


            <div class="box">

                <h2>
                    Your Products
                </h2>

                ${itemsHTML}

            </div>


            <div class="box">

                <h2>
                    Cart Summary
                </h2>


                <div class="row">

                    <span>
                        Total Items
                    </span>

                    <strong>
                        ${totalItems}
                    </strong>

                </div>


                <div class="row">

                    <span>
                        Total Business Points
                    </span>

                    <strong class="total-points">
                        ${totalPoints}
                    </strong>

                </div>


                <div class="total">

                    <span>
                        Total
                    </span>

                    <span>
                        ${price(totalAmount)}
                    </span>

                </div>


                <!-- DIRECT CHECKOUT LINK -->

                <a
                    href="checkout.html"
                    class="checkout"
                >
                    Proceed to Checkout
                </a>


                <a
                    href="products.html"
                    class="products"
                >
                    Continue Shopping
                </a>

            </div>


        </div>

    `;

}


/* ================================
   START
================================ */

renderCart();

</script>


</body>

</html>
