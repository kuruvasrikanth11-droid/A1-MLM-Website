<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A1 Reset Password</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f6fb;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:420px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 8px 30px rgba(0,0,0,.10);
}

.logo{
    width:80px;
    height:80px;
    line-height:80px;
    margin:0 auto 20px;
    border-radius:50%;
    background:#071a3d;
    color:#ffb000;
    text-align:center;
    font-size:42px;
    font-weight:bold;
}

h1{
    text-align:center;
    color:#071a3d;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

label{
    display:block;
    margin:15px 0 7px;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d5dbe5;
    border-radius:7px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:25px;
    border:none;
    border-radius:7px;
    background:#0758a8;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#777;
}

.message{
    display:none;
    margin-top:18px;
    padding:14px;
    border-radius:7px;
    text-align:center;
    line-height:1.5;
}

.success{
    background:#e5f7e8;
    color:#146b2e;
}

.error{
    background:#ffe5e5;
    color:#b00020;
}

</style>

</head>

<body>

<div class="box">

<div class="logo">
A1
</div>

<h1>
Reset Password
</h1>

<p class="subtitle">
Create a new password for your A1 account
</p>

<form id="resetForm">

<label>
New Password
</label>

<input
    type="password"
    id="password"
    placeholder="Enter new password"
    minlength="6"
    required
>

<label>
Confirm Password
</label>

<input
    type="password"
    id="confirmPassword"
    placeholder="Confirm new password"
    minlength="6"
    required
>

<button
    type="submit"
    id="resetButton"
>
Update Password
</button>

</form>

<div
    id="message"
    class="message"
></div>

</div>


<script>

const SUPABASE_URL =
"https://rtnxobtczeaxtpxgvfpb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_f8QIMjFi5Zm2a10LcODEPg_z8EOWM3_";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


function showMessage(text,type){

    const message =
        document.getElementById("message");

    message.innerText =
        text;

    message.className =
        "message " + type;

    message.style.display =
        "block";
}


document
.getElementById("resetForm")
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const password =
            document
            .getElementById("password")
            .value;

        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value;

        const button =
            document
            .getElementById("resetButton");


        if(password !== confirmPassword){

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;
        }


        button.disabled =
            true;

        button.innerText =
            "Updating Password...";


        try{

            const {
                error
            } =
            await supabaseClient
            .auth
            .updateUser({

                password:
                    password

            });


            if(error){

                throw error;

            }


            showMessage(
                "Password updated successfully! You can now login.",
                "success"
            );


            button.innerText =
                "Password Updated";


            setTimeout(
                function(){

                    window.location.href =
                    "login.html";

                },
                2000
            );


        }catch(error){

            console.error(error);

            showMessage(
                "Password update failed: " +
                error.message,
                "error"
            );

            button.disabled =
                false;

            button.innerText =
                "Update Password";

        }

    }
);

</script>

</body>

</html>
